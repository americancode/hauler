name: Docker

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
      - '*.*.*'
      - '*.*.*-*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-amd64:
    name: Build and scan amd64 image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 quarantine image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: release
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          cache-from: type=gha,scope=hauler-amd64
          cache-to: type=gha,mode=max,scope=hauler-amd64
          provenance: mode=max
          sbom: true
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Scan amd64 quarantine image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-amd64
        run: |
          trivy image --image-src remote --platform linux/amd64 --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --pkg-types os,library \
            --format json --output "${RUNNER_TEMP}/trivy-image.json" --exit-code 0 "${IMAGE}"
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${RUNNER_TEMP}/trivy-image.json")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${RUNNER_TEMP}/trivy-image.json")"
          echo "amd64 image vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high == 0 ))

  build-arm64:
    name: Build and scan arm64 image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build arm64 quarantine image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: release
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          cache-from: type=gha,scope=hauler-arm64
          cache-to: type=gha,mode=max,scope=hauler-arm64
          provenance: mode=max
          sbom: true
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Scan arm64 quarantine image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: |
          trivy image --image-src remote --platform linux/arm64 --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --pkg-types os,library \
            --format json --output "${RUNNER_TEMP}/trivy-image.json" --exit-code 0 "${IMAGE}"
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${RUNNER_TEMP}/trivy-image.json")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${RUNNER_TEMP}/trivy-image.json")"
          echo "arm64 image vulnerabilities: CRITICAL=${critical} HIGH=${high}"
          (( critical == 0 && high == 0 ))

  publish:
    name: Promote and sign image
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1
      - name: Promote and sign scanned image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "invalid semver tag: ${REF_NAME}" >&2; exit 1; }
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}@${AMD64_DIGEST}" "${IMAGE}@${ARM64_DIGEST}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '/^Digest:/ { print $2; exit }')"
          test -n "${digest}"
          cosign sign --yes "${IMAGE}:${VERSION}@${digest}"
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${digest}"
            cosign sign --yes "${IMAGE}:latest@${digest}"
          fi
