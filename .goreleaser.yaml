version: 2

project_name: hauler
before:
  hooks:
    - go mod tidy
    - go mod download
    - go fmt ./...
    - go vet ./...

release:
  prerelease: auto
  make_latest: false

env:
  - vpkg=hauler.dev/go/hauler/v2/internal/version

builds:
  - dir: ./cmd/hauler/.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X {{ .Env.vpkg }}.gitVersion={{ .Version }} -X {{ .Env.vpkg }}.gitCommit={{ .ShortCommit }} -X {{ .Env.vpkg }}.gitTreeState={{if .IsGitDirty}}dirty{{else}}clean{{end}} -X {{ .Env.vpkg }}.buildDate={{ .Date }}
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=boringcrypto

changelog:
  disable: false
  use: git

dockers_v2:
  - id: hauler
    dockerfile: Dockerfile
    flags:
      - "--target=release"
    images:
      - ghcr.io/hauler-dev/hauler
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "classification": "UNCLASSIFIED"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.description": "Hauler: Airgap Swiss Army Knife"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.version": "{{.Version}}"

  - id: hauler-debug
    dockerfile: Dockerfile
    flags:
      - "--target=debug"
    images:
      - ghcr.io/hauler-dev/hauler-debug
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "classification": "UNCLASSIFIED"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.description": "Hauler: Airgap Swiss Army Knife"
      "org.opencontainers.image.name": "{{.ProjectName}}-debug"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.version": "{{.Version}}"
